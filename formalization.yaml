      status: "proved"
      note: "No compatible metric on a simple triod has the DMP."
    - source: "Theorem 11.1"
      lean: "DoubleMidset.Paper.theorem_11_1"
      module: "Solution"
      status: "proved"
      note: "No compatible metric on an arc has the DMP."
    - source: "Theorem A"
      lean: "DoubleMidset.Paper.theorem_A"
      module: "Solution"
      status: "proved"
      note: "A nondegenerate compact connected metric space with `|M(a, b)| = 2` for all distinct `a, b` is homeomorphic to `S¹`."
    - source: "Theorem A, converse"
      lean: "DoubleMidset.Paper.circle_hasDMP"
      module: "Solution"
      status: "proved"
      note: "The unit circle with the Euclidean metric has the DMP."
    - source: "Theorem A, characterization"
      lean: "DoubleMidset.Paper.theorem_A_iff"
      module: "Solution"
      status: "proved"
      note: "A nondegenerate metrizable continuum admits a compatible metric with the DMP if and only if it is a simple closed curve."
    - source: "Theorem B"
      lean: "DoubleMidset.Paper.theorem_B"
      module: "Solution"
      status: "proved"
      note: "No finite tree admits a compatible metric with the DMP. In particular, neither an arc nor a simple triod does."
    - source: "Theorem C"
      lean: "DoubleMidset.Paper.theorem_C"
      module: "Solution"
      status: "proved"
      note: "A dendrite with `|M(a, b)| ≤ 2` for all distinct `a, b`: every point has order at most four; for a branch point of order `m`, `(m - 2)(|B| - 1) ≤ m`; there are at most four branch points; and it is a finite tree."
