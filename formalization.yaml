      module: "Solution"
      status: "proved"
      note: ": for a strict pair, `N(a, b) ≡ N(b, a) (mod 2)`."
    - source: "Lemma 5.4 (parity)"
      lean: "DoubleMidset.Paper.lemma_5_4"
      module: "Solution"
