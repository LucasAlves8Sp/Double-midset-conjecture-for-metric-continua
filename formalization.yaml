    - source: "Lemma 6.3 (off-sphere parity)"
      lean: "DoubleMidset.Paper.lemma_6_3"
      module: "Solution"
      status: "proved"
    - source: "Proposition 6.5 (odd boxes lie on a sphere)"
      lean: "DoubleMidset.Paper.prop_6_5"
      module: "Solution"
      status: "proved"
    - source: "Lemma 6.6 (continuous selection of the touch)"
      lean: "DoubleMidset.Paper.lemma_6_6"
      module: "Solution"
      status: "proved"
    - source: "Corollary 6.7"
      lean: "DoubleMidset.Paper.cor_6_7"
      module: "Solution"
      status: "proved"
    - source: "Lemma 7.1 (tips are not centers)"
      lean: "DoubleMidset.Paper.lemma_7_1"
